<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ことわざクイズ</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .question-container { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    .choices { margin-bottom: 10px; }
    .choices button { margin: 5px; padding: 5px; }
  </style>
</head>
<body>
  <h1>ことわざクイズ</h1>
  <div id="quiz-container"></div>
  <p>経過時間: <span id="elapsed-time">0</span> 秒</p>
  <p>合計得点: <span id="total-score">0</span> / <span id="total-questions">0</span></p>
  <p id="final-message"></p>

  <script>
    let questions = []; // グローバル変数として questions を定義
    let userAnswers = []; 
    let correctAnswers = [];
    let answeredQuestions = new Set();
    let totalScore = 0;
    let startTime = Date.now();

    // JSONデータを取得する関数
    async function loadJson() {
      try {
        const response = await fetch('https://kabigonbe.github.io/river/jsons/quiz.json');
        questions = await response.json(); // ここで questions にデータを格納
        console.log("取得したデータ:", questions);
        startQuiz(); // データ取得後にクイズを開始
      } catch (error) {
        console.error('エラー:', error);
      }
    }

    function startQuiz() {
      document.getElementById("total-questions").textContent = questions.length;
      createQuiz();
      updateElapsedTime();
    }

    function getRandomChoices(answersList, n, correctAnswer) {
      const filtered = answersList.filter(ans => ans !== correctAnswer);
      const shuffled = filtered.sort(() => 0.5 - Math.random());
      const choices = shuffled.slice(0, n - 1);
      choices.push(correctAnswer);
      return choices.sort(() => 0.5 - Math.random());
    }

    function createQuiz() {
      const quizContainer = document.getElementById("quiz-container");
      const allAns1 = questions.map(q => q.解答1);
      const allAns2 = questions.map(q => q.解答2);

      questions.forEach((question, index) => {
        userAnswers[index] = { ans1: null, ans2: null };
        correctAnswers[index] = { ans1: question.解答1, ans2: question.解答2 };

        const questionDiv = document.createElement("div");
        questionDiv.classList.add("question-container");
        questionDiv.setAttribute("id", `question-${index}`);

        const questionText = document.createElement("p");
        questionText.textContent = question.問題文;
        questionDiv.appendChild(questionText);

        const title1 = document.createElement("p");
        title1.textContent = "【選択肢１】";
        questionDiv.appendChild(title1);

        const choicesContainer1 = document.createElement("div");
        choicesContainer1.classList.add("choices");
        const choices1 = getRandomChoices(allAns1, 5, question.解答1);
        choices1.forEach(choice => {
          const button = document.createElement("button");
          button.textContent = choice;
          button.onclick = () => checkAnswer(index, "ans1", choice, choicesContainer1, questionDiv);
          choicesContainer1.appendChild(button);
        });
        questionDiv.appendChild(choicesContainer1);

        const title2 = document.createElement("p");
        title2.textContent = "【選択肢２】";
        questionDiv.appendChild(title2);

        const choicesContainer2 = document.createElement("div");
        choicesContainer2.classList.add("choices");
        const choices2 = getRandomChoices(allAns2, 5, question.解答2);
        choices2.forEach(choice => {
          const button = document.createElement("button");
          button.textContent = choice;
          button.onclick = () => checkAnswer(index, "ans2", choice, choicesContainer2, questionDiv);
          choicesContainer2.appendChild(button);
        });
        questionDiv.appendChild(choicesContainer2);

        quizContainer.appendChild(questionDiv);
      });
    }

    function checkAnswer(questionIndex, setType, selected, container, questionDiv) {
      if (userAnswers[questionIndex][setType] !== null) return;

      userAnswers[questionIndex][setType] = selected;
      container.querySelectorAll("button").forEach(button => button.disabled = true);

      const current = userAnswers[questionIndex];
      if (current.ans1 !== null && current.ans2 !== null) {
        if (current.ans1 === correctAnswers[questionIndex].ans1 &&
            current.ans2 === correctAnswers[questionIndex].ans2) {
          questionDiv.style.backgroundColor = "#d4edda"; 
          totalScore++;
        } else {
          questionDiv.style.backgroundColor = "#f8d7da"; 
        }
        answeredQuestions.add(questionIndex);
        document.getElementById("total-score").textContent = totalScore;

        if (answeredQuestions.size === questions.length) {
          endQuiz();
        }
      }
    }

    function updateElapsedTime() {
      if (answeredQuestions.size < questions.length) {
        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("elapsed-time").textContent = elapsedTime;
        setTimeout(updateElapsedTime, 1000);
      }
    }

    function endQuiz() {
      const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById("elapsed-time").textContent = elapsedTime;
      document.getElementById("final-message").textContent = `全問解答完了！お疲れ様でした🎉`;
    }

    window.onload = loadJson;
  </script>
</body>
</html>

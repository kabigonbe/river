<!DOCTYPE html>

  <style>
    /* 全体のスタイル */
    html,body {
      height:100%;
      font-family: 'Arial', sans-serif;
      background: #f4f4f9;
      color: #333;
      text-align: left;
      margin: 3px;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .controls select {
      margin: 1px;  /* ドロップダウン同士の間隔を狭くする */

    /* セレクトボックス & ボタン */

      border: 1px solid #ccc;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    /* クイズのコンテナ */
    #quiz-container {
      flex-grow: 1;
      width: 100h-5px;
      font-size: 24px;
//      min-height:400px;
      text-align: left;
      margin: 1px;
      background: white;
      padding: 5px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);

    .question-container {
      width: 100%;
      height:100%;
      overflow-y: auto;
      position:relative;
      font-size: 24px;
      margin-bottom: 5px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;

    }

    .question-text {

      font-weight: bold;
    }

    .question-container:hover {
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    .correct-mark::before {
        aspect-ratio:1 / 1;
        content:"";
        position: absolute;
        top: 20%;
        left:50%;
        width: 200px;
        height:200px;
        border: 20px solid white;
        border-radius: 50%;
        transform: translate(0%,0%);
        background-color: transparent;
    }

    .incorrect-mark {
        position: absolute;
        top: 20%;
        left: 50%;
        width: 200px;  /* サイズ */
        height: 200px;
        transform: translate(0%, 0%);
    }
    
    .incorrect-mark::before,
    .incorrect-mark::after {
        content: "";
        position: absolute;
        width: 250px; /* 線の長さ */
        height: 20px; /* 線の太さ */
        background-color: white;
        top: 50%;
        left: 0;
        transform-origin: center;
    }
    
    .incorrect-mark::before {
        transform: rotate(45deg);
    }
    
    .incorrect-mark::after {
        transform: rotate(-45deg);
    }


    .correct {
      background-color: #d4edda !important;
    }

    .incorrect {
      background-color: #dc3545 !important;
      color: white;
    }

    .keyboard {

      text-align: center;
      font-size: 24px;
      padding: 15px;
      border: 2px solid #ccc;
      background-color: #f9f9f9;

<script>
    let questions = [];
    let allQuestions = {};
    let questionRanges = {};
    let correctAnswers = [];
    let answeredQuestions = new Set();
    let totalScore = 0;
    let startTime = Date.now();
    let incorrectAnswers = [];

    // JSONデータを取得する関数
    async function loadJson() {
      try {
        const response = await fetch('https://kabigonbe.github.io/river/jsons/question.json');
        allQuestions = await response.json(); // ここで questions にデータを格納
        console.log(allQuestions)

        const $categorySelect = document.getElementById("category-select");

        Object.keys(allQuestions).forEach(categoryName => {
          let option = document.createElement("option");
          option.value = categoryName;
          option.textContent = categoryName;
          $categorySelect.appendChild(option);
        });

        // 初回のカテゴリを選択
        $categorySelect.selectedIndex = 0;
        updateQuestionRanges();

        $categorySelect.addEventListener("change", updateQuestionRanges);
        document.getElementById("question-range-select").addEventListener("change", startQuiz);

        startQuiz();

      } catch (error) {
        console.error('エラー:', error);
      }
    }

    function getRandomQuestions(questionList, count) {
      let shuffled = [...questionList].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function updateQuestionRanges() {
      const category = document.getElementById("category-select").value;
      const questionList = allQuestions[category] || [];
      const maxIndex = Math.max(...questionList.map(q => q.index), 1);
      const rangeSelect = document.getElementById("question-range-select");
    
      rangeSelect.innerHTML = "";
      questionRanges[category] = [];
    
      for (let i = 1; i <= maxIndex; i += 20) {
        let end = Math.min(i + 19, maxIndex);
        let rangeLabel = `${i}～${end}`;
        questionRanges[category].push({ start: i, end: end });
    
        let option = document.createElement("option");
        option.value = `${i}-${end}`;
        option.textContent = rangeLabel;
        rangeSelect.appendChild(option);
      }

      let allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "全ての問題";
      rangeSelect.appendChild(allOption);
    
      let randomOption = document.createElement("option");
      randomOption.value = "random";
      randomOption.textContent = "ランダム10問";
      rangeSelect.appendChild(randomOption);
    
      rangeSelect.selectedIndex = 0;
      startQuiz();
    }

    function startQuiz() {
      const category = document.getElementById("category-select").value;
      const range = document.getElementById("question-range-select").value;
      let selectedQuestions = allQuestions[category] || [];
    
      if (range === "random") {
        selectedQuestions = getRandomQuestions(selectedQuestions, 10);
      } else if (range === "all") {
        // すべての問題を出題
      } else {
        const [start, end] = range.split("-").map(Number);
        selectedQuestions = selectedQuestions.filter(q => q.index >= start && q.index <= end);
      }
    
      questions = selectedQuestions;

      document.getElementById("total-questions").textContent = questions.length;
      incorrectAnswers = [];
      init();
      createQuiz();
      updateElapsedTime();
    }


    function createQuiz() {
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = "";

      questions.forEach((question, index) => {
        if(index!==0) return;
        correctAnswers[index] = {問題文:question.問題文,
                                 数式:question.数式,
                                 解答:question.解答,
                                 解説:question.解説,
                                 type:question.type};

        const questionDiv = document.createElement("div");
        questionDiv.classList.add("question-container");
        questionDiv.setAttribute("id", `question-${index}`);

        const questionText = document.createElement("p");
        questionText.textContent = question.問題文;
        questionText.classList.add("question-text");
        questionDiv.appendChild(questionText);

        const questionForm = document.createElement("p");
        questionForm.textContent = question.数式;
        questionDiv.appendChild(questionForm);
        quizContainer.appendChild(questionDiv);
      });
      MathJax.typesetPromise();
    }

  function normalizeMathML(mathml) {
      return mathml
          .replace(/\s+/g, '') // 余分な空白を削除
          .replace(/<mstyle[^>]*>/g, '').replace(/<\/mstyle>/g, '') // <mstyle> を削除
          .replace(/<mrow[^>]*><\/mrow>/g, ''); // 空の <mrow> を削除
  }

  function showCorrectMark(questionIndex) {
      const questionDiv = document.getElementById(`question-${questionIndex}`);
  
      // 既に「〇」がある場合は削除
      let existingMark = questionDiv.querySelector(".correct-mark");
      if (existingMark) {
          existingMark.remove();
      }
      existingMark = questionDiv.querySelector(".incorrect-mark");
      if (existingMark) {
          existingMark.remove();
      }
  }

  function checkAnswer() {
    const correctTex = correctAnswers[0]["解答"];
    const mathField = document.getElementById("mathfield");
    const userTex = "\\("+mathField.getValue()+"\\)";

    // MathJax に数式を MathML としてレンダリング
//    document.getElementById("renderUser").innerHTML = `\\(${userTex}\\)`;
//    document.getElementById("renderCorrect").innerHTML = `${correctTex}`;

    

    MathJax.typesetPromise().then(() => {
      // MathML の内部構造を取得
//      const correctMathML = document.getElementById("renderCorrect").querySelector("math").outerHTML;
//      const userMathML = document.getElementById("renderUser").querySelector("math").outerHTML;
      const correctMathML = MathJax.tex2mml(correctTex);
      const userMathML = MathJax.tex2mml(userTex);
      console.log("正しい答え"+correctMathML)
      console.log("入力した答え"+userMathML)
      // 正規化して比較
      const questionDiv = document.getElementById(`question-${0}`);
      if (normalizeMathML(correctMathML) === normalizeMathML(userMathML)) {
          questionDiv.style.backgroundColor = "#d4edda"; 
          showCorrectMark(0);
          const correctMark = document.createElement("div");
          correctMark.classList.add("correct-mark");
          questionDiv.appendChild(correctMark);
      } else {
          questionDiv.style.backgroundColor = "#f8d7da"; 
          showCorrectMark(0);
          const correctMark = document.createElement("div");
          correctMark.classList.add("incorrect-mark");
          questionDiv.appendChild(correctMark);
      }

      if (!questionDiv.querySelector(".answer-container")) {
        const answerContainer = document.createElement("div");
        answerContainer.classList.add("answer-container");

        // 解答の表示
        const inputText = document.createElement("p");
        inputText.innerHTML = `<strong>あなたの回答:</strong> ${userTex}`;
        answerContainer.appendChild(inputText);

        // 解答の表示
        const answerText = document.createElement("p");
        answerText.innerHTML = `<strong>正解:</strong> ${correctTex}`;
        answerContainer.appendChild(answerText);

        // 解説の表示
        const explanationText = document.createElement("p");
        explanationText.innerHTML = `<strong>解説:</strong> ${correctAnswers[0]["解説"]}`;
        answerContainer.appendChild(explanationText);

        questionDiv.appendChild(answerContainer);
        MathJax.typesetPromise();
      }
    });
  }

    function updateElapsedTime() {
      if (answeredQuestions.size < questions.length) {
        const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById("elapsed-time").textContent = elapsedTime;
        setTimeout(updateElapsedTime, 1000);
      }
    }

  <!-- カスタムキーボード（数字、.、÷、帯分数、クリア、決定） -->
  <table class="keyboard">
    <tr>
      <td class="key" onclick="handleDivision()">分数</td>
      <td class="key" onclick="insertMixedFraction()">帯分数</td>
      <td class="key" colspan="2" onclick="clearField()">クリア</td>
    </tr>
    <tr>
      <td class="key" onclick="insertDigit('7')">7</td>
      <td class="key" onclick="insertDigit('8')">8</td>
      <td class="key" onclick="insertDigit('9')">9</td>
      <td class="key" onclick="mathField.executeCommand('deleteBackward')">⌫</td>
    </tr>
    <tr>
      <td class="key" onclick="insertDigit('4')">4</td>
      <td class="key" onclick="insertDigit('5')">5</td>
      <td class="key" onclick="insertDigit('6')">6</td>
      <td class="key" onclick="mathField.executeCommand('moveToNextChar')">🔜</td>
    </tr>
    <tr>
      <td class="key" onclick="insertDigit('1')">1</td>
      <td class="key" onclick="insertDigit('2')">2</td>
      <td class="key" onclick="insertDigit('3')">3</td>
      <td class="key" onclick="mathField.executeCommand('moveToPreviousChar')">🔙</td>
    </tr>
    <tr>
      <td class="key" onclick="insertDigit('0')">0</td>
      <td class="key" onclick="insertDigit('.')">.</td>
      <td class="key" colspan="2" onclick="checkAnswer()">決定</td>
    </tr>

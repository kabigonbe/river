<html>
<head>
    <meta charset="UTF-8">
    <title>農産物別都道府県情報</title>
    <style>
		/* 全体のスタイル */
		body {
		    font-family: 'Arial', sans-serif;
		    margin: 0;
		    padding: 0;
		    background-color: #f9f9f9;
		    color: #333;
		    line-height: 1.8;
		}
		
		/* コンテナ全体 */
		.container {
		    max-width: 1200px; /* 地図の最大幅を確保 */
		    margin: 0 auto;
		    padding: 15px;
		}
		
		/* ヘッダー */
		.header {
		    text-align: center;
		    background-color: #377eb8;
		    color: #fff;
		    padding: 20px;
		    border-radius: 8px;
		    margin-bottom: 20px;
		}
		
		.header h1 {
		    font-size: 24px;
		    margin: 0;
		}
		
		/* コントロールエリア */
		.controls {
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    flex-wrap: wrap;
		    margin-bottom: 20px;
		}
		
		.controls label {
		    margin-right: 10px;
		    font-weight: bold;
		    font-size: 16px;
		}
		
		.dropdown {
		    padding: 12px;
		    border: 1px solid #ccc;
		    border-radius: 5px;
		    font-size: 16px;
		    outline: none;
		    width: 100%;
		    max-width: 300px;
		    transition: all 0.3s ease;
		}
		
		.dropdown:hover,
		.dropdown:focus {
		    border-color: #377eb8;
		    box-shadow: 0 0 5px rgba(55, 126, 184, 0.5);
		}
		
		/* ランキング表示エリア */
		.ranking-display {
		    margin-bottom: 20px;
		    background-color: #fff;
		    padding: 20px;
		    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
		    border-radius: 8px;
		}
		
		/* 地図表示エリア */
		.map-container {
		    background-color: #fff;
		    padding: 20px;
		    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
		    border-radius: 8px;
		    margin: 0 auto;
		    max-width: 100%; /* 地図エリアを画面幅に合わせる */
		    height: 600px; /* 高さを大きく確保 */
		}
		
		/* 地図エリアの調整（スマホ向け） */
		@media (max-width: 768px) {
		    .map-container {
		        max-width: 100%;
		        height: 500px; /* 中型画面用の高さ調整 */
		    }
		
		    .header h1 {
		        font-size: 22px;
		    }
		
		    .controls label {
		        font-size: 14px;
		    }
		
		    .dropdown {
		        font-size: 14px;
		        padding: 10px;
		    }
		}
		
		@media (max-width: 480px) {
		    .map-container {
		        max-width: 100%;
		        height: 400px; /* スマホ用の高さ調整 */
		    }
		
		    .ranking-display {
		        padding: 20px;
		    }
		
		    .header h1 {
		        font-size: 40px; /* スマホ用ヘッダー文字サイズ */
		    }
		
		    .controls label {
		        font-size: 28px;
		    }
		
		    .dropdown {
		        font-size: 28px;
		        padding: 20px;
		    }
		
		    .ranking-table th,
		    .ranking-table td {
		        font-size: 28px; /* テーブルの文字サイズを調整 */
		    }
		}
		
		/* テーブルのスタイル */
		.ranking-table {
		    border-collapse: collapse;
		    width: 100%;
		    font-family: 'Arial', sans-serif;
		    margin: 30px 0;
		    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
		    border-radius: 16px;
		    overflow: hidden;
		}
		
		.ranking-table thead tr {
		    background-color: #377eb8;
		    color: #ffffff;
		    text-align: left;
		    font-weight: bold;
		}
		
		.ranking-table th,
		.ranking-table td {
		    padding: 24px 30px;
		    text-align: center;
		    font-size: 28px;
		}
		
		.ranking-table tbody tr:nth-child(even) {
		    background-color: #f2f2f2;
		}
		
		.ranking-table tbody tr:hover {
		    background-color: #ffebcd;
		    transition: background-color 0.3s ease;
		}
		
		.ranking-table tbody tr:first-child td {
		    font-weight: bold;
		    color: #d9534f; /* 1位を赤で強調 */
		}
    </style>
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script type="text/javascript" src="./jmap.js"></script>
    <script type = "text/javascript">
        $(document).ready(function() {
            let rankings = {};
            // 日本全体の都道府県データ
            const allPrefectures = [
                { code: 1, name: "北海道" },
                { code: 2, name: "青森" },
                { code: 3, name: "岩手" },
                { code: 4, name: "宮城" },
                { code: 5, name: "秋田" },
                { code: 6, name: "山形" },
                { code: 7, name: "福島" },
                { code: 8, name: "茨城" },
                { code: 9, name: "栃木" },
                { code: 10, name: "群馬" },
                { code: 11, name: "埼玉" },
                { code: 12, name: "千葉" },
                { code: 13, name: "東京" },
                { code: 14, name: "神奈川" },
                { code: 15, name: "新潟" },
                { code: 16, name: "富山" },
                { code: 17, name: "石川" },
                { code: 18, name: "福井" },
                { code: 19, name: "山梨" },
                { code: 20, name: "長野" },
                { code: 21, name: "岐阜" },
                { code: 22, name: "静岡" },
                { code: 23, name: "愛知" },
                { code: 24, name: "三重" },
                { code: 25, name: "滋賀" },
                { code: 26, name: "京都" },
                { code: 27, name: "大阪" },
                { code: 28, name: "兵庫" },
                { code: 29, name: "奈良" },
                { code: 30, name: "和歌山" },
                { code: 31, name: "鳥取" },
                { code: 32, name: "島根" },
                { code: 33, name: "岡山" },
                { code: 34, name: "広島" },
                { code: 35, name: "山口" },
                { code: 36, name: "徳島" },
                { code: 37, name: "香川" },
                { code: 38, name: "愛媛" },
                { code: 39, name: "高知" },
                { code: 40, name: "福岡" },
                { code: 41, name: "佐賀" },
                { code: 42, name: "長崎" },
                { code: 43, name: "熊本" },
                { code: 44, name: "大分" },
                { code: 45, name: "宮崎" },
                { code: 46, name: "鹿児島" },
                { code: 47, name: "沖縄" }
            ];

//            $('#jmap').jmap({
//                showHeatmap: true,
//                showHeatlabel: true,
//                heatmapLabelUnit: '順位',
//                heatmapConditions: ["==1","==2","==3","==4","==5", ">=6"],
////                heatmapType: "Set1",
//                heatmapColors: ["red", "yellow", "#377eb8", "#4daf4a", "#984ea3", "#eeeeee"],
//                areas: areas
//            });
            fetch('https://kabigonbe.github.io/river/farm_products.json')
                .then(response => response.json())
                .then(data => {
                    rankings = data["rankings"]; // 取得したランキングデータを格納
					console.log('取得したランキングデータ:', rankings);

                    // ランキング選択メニューを生成
                    const $rankingSelect = $('#ranking-select');
                    Object.keys(rankings).forEach(rankingName => {
                        $rankingSelect.append(`<option value="${rankingName}">${rankingName}</option>`);
                    });

                    // 初期描画（いちごランキングでスタート）
                    renderMap('米');

                    // ランキング切り替えイベント
                    $rankingSelect.on('change', function () {
                        const selectedRanking = $(this).val();
                        renderMap(selectedRanking);
                    });
                })
                .catch(error => console.error('ランキングデータの読み込みに失敗しました:', error));

            function renderMap(rankingName) {

                const ranking = rankings[rankingName];
			    // 上位5位までのデータを取得
			    const top5 = ranking.slice(0, 5);
			    console.log('上位5位データ:', top5);
			    // ランキング表示用のHTML生成
			    let rankingHtml = `<h2>${rankingName}ランキング</h2>`;
			    rankingHtml += '<table class="ranking-table" >';
			    rankingHtml += '<tr><th>順位</th><th>都道府県名</th><th>産出額 (億円)</th><th>構成比 (%)</th></tr>';
			    top5.forEach((item, index) => {
			        rankingHtml += `
			            <tr>
			                <td>${index + 1}</td>
			                <td align="left">${item["都道府県名"]}</td>
			                <td align="right">${item["産出額"]}</td>
			                <td align="right">${item["構成比"]}</td>
			            </tr>
			        `;
			    });
			    rankingHtml += '</table>';

			    // #ranking-display に表示
			    $('#ranking-display').html(rankingHtml);

			    // 地図描画のサイズを動的に計算
			    const isMobile = window.innerWidth <= 768; // 768px以下をモバイルと判断
			    const mapWidth = isMobile ? window.innerWidth - 30 : Math.min(window.innerWidth * 0.9, 1100); // 幅を動的に調整
			    const mapHeight = isMobile ? window.innerHeight * 0.8 : 1000; // 高さを動的に調整

                const areas = allPrefectures.map(pref => {
                    const rankData = ranking.find(rank => rank.code === pref.code);
                    return {
                        code: pref.code,
                        name: pref.name,
						"構成比":rankData ? rankData.rank : "-",
						"産出額":rankData ? rankData.rank : "-",
                        number: rankData ? rankData.rank : 47 // ランキング外は47
                    };
                });
                // #jmapをクリアして再描画
                $('#jmap').empty();

                $('#jmap').jmap({
                    showHeatmap: true,
                    showHeatlabel: true,
					width:mapWidth,
					height:mapHeight,
                    heatmapLabelUnit: '位',
                    heatmapConditions: ["==1", "==2", "==3", "==4", "==5", ">=6"],
                    heatmapColors: ["#cc3333", "#df5353", "#e55d5d", "#ee7f7f", "#fae1e1", "#bfc7ce"],
					heatmapFontColors: ["#fff","#fff","#fff","#fff","#fff","#fff"],
                    areas: areas
                });
            }

//            // 初期描画（いちごランキングでスタート）
//            renderMap('いちご');
//
//            // ランキング選択メニューの生成
//            const $rankingSelect = $('#ranking-select');
//            Object.keys(rankings).forEach(rankingName => {
//                $rankingSelect.append(`<option value="${rankingName}">${rankingName}</option>`);
//            });
//            // ランキング選択時のイベント
//            $rankingSelect.on('change', function () {
//                const selectedRanking = $(this).val();
//                renderMap(selectedRanking);
//            });
        });

    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>農産物別都道府県情報</h1>
        </header>
        <div class="controls">
            <label for="ranking-select">ランキングを選択:</label>
            <select id="ranking-select" class="dropdown"></select>
        </div>
        <div id="ranking-display" class="ranking-display"></div>
        <div id="jmap" class="map-container"></div>
    </div></body>
</html>

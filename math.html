<body>
<script>
    let questions = [];
    let allQuestions = {};
    let filterQuestions = {};
    let questionRanges = {};
    let correctAnswers = [];
    let answeredQuestions = new Set();
    let totalScore = 0;
    let startTime = Date.now();
    let isCorrect;

    let currentQuestionIndex = 0;
    let incorrectAnswers = [];
    let resultAnswers = [];
    let maxQuestions = 10;

    // JSONデータを取得する関数
    async function loadJson() {
      try {
        const response = await fetch('https://kabigonbe.github.io/river/jsons/question.json');
//        const response = await fetch('http://192.168.3.7:8000/jsons/question.json');
        allQuestions = await response.json(); // ここで questions にデータを格納
        filterQuestions = structuredClone(allQuestions);
        const { indexes,tagList } = getQueryParams();

        const $categorySelect = document.getElementById("category-select");
        const $difficultySelect = document.getElementById("difficulty-select");
  
        Object.keys(filterQuestions).forEach(categoryName => {
          let option = document.createElement("option");
          option.value = categoryName;
          option.textContent = categoryName;
          $categorySelect.appendChild(option);
        });

        // 初回のカテゴリを選択
        $categorySelect.selectedIndex = 0;
        updateQuestionRanges();
  
        $categorySelect.addEventListener("change", updateQuestionRanges);
        $categorySelect.addEventListener("change", selectedQuestionsAndStart);
        $difficultySelect.addEventListener("change", updateQuestionRanges);
        $difficultySelect.addEventListener("change", selectedQuestionsAndStart);
        document.getElementById("question-range-select").addEventListener("change", selectedQuestionsAndStart);

        if (indexes.length > 0) {
          questions = createQuestionsFromIndexes(indexes);
        } else {
          updateQuestions();
        }
        document.getElementById("total-questions").textContent = questions.length;
        init();
        createQuiz();
      } catch (error) {
        console.error('エラー:', error);
      }
    }

    function getRandomQuestions(questionList, count) {
      let shuffled = [...questionList].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function updateQuestionRanges() {
      const category = document.getElementById("category-select").value;
      const levels = document.getElementById("difficulty-select").value.split(",");
      filterQuestions = structuredClone(allQuestions);
      const { indexes,tagList } = getQueryParams();

      if (tagList.length > 0) {
        // カテゴリごとにフィルタする
        Object.keys(filterQuestions).forEach(cat => {
          filterQuestions[cat] = filterQuestions[cat].filter(q => 
            tagList.every(tag => q.tags.includes(tag)) 
            // ↑OR条件: いずれかのタグが含まれていればOK
            // もし全タグを含む問題に絞りたいなら every() にする
            // tagList.every(tag => q.tags.includes(tag))
          );
        });
      }

      Object.keys(filterQuestions).forEach(cat => {
        filterQuestions[cat] = filterQuestions[cat].filter(q => 
          levels.some(levels => q.難易度.toString().includes(levels)) 
        );
      });
      let questionList = filterQuestions[category] || [];
      const maxIndex = questionList.length;
      const rangeSelect = document.getElementById("question-range-select");
      
      rangeSelect.innerHTML = "";
      questionRanges[category] = [];
    
      let randomOption = document.createElement("option");
      randomOption.value = "random";
      randomOption.textContent = "ランダム10問";
      rangeSelect.appendChild(randomOption);

      for (let i = 1; i <= maxIndex; i += 10) {
        let end = Math.min(i + 9, maxIndex);
        let option = document.createElement("option");
        option.value = `${i}-${end}`;
        option.textContent = `${i}～${end}`;
        rangeSelect.appendChild(option);
      }

      let allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "全ての問題";
      rangeSelect.appendChild(allOption);
    
      rangeSelect.selectedIndex = 0;
      init();
      createQuiz();
    }

    function updateQuestions(){
      const category = document.getElementById("category-select").value;
      const levels = document.getElementById("difficulty-select").value.split(",");
      filterQuestions = structuredClone(allQuestions);
      const { indexes,tagList } = getQueryParams();

      if (tagList.length > 0) {
        // カテゴリごとにフィルタする
        Object.keys(filterQuestions).forEach(cat => {
          filterQuestions[cat] = filterQuestions[cat].filter(q => 
            tagList.every(tag => q.tags.includes(tag)) 
            // ↑OR条件: いずれかのタグが含まれていればOK
            // もし全タグを含む問題に絞りたいなら every() にする
            // tagList.every(tag => q.tags.includes(tag))
          );
        });
      }

      Object.keys(filterQuestions).forEach(cat => {
        filterQuestions[cat] = filterQuestions[cat].filter(q => 
          levels.some(levels => q.難易度.toString().includes(levels)) 
        );
      });
      let questionList = filterQuestions[category] || [];
      const range = document.getElementById("question-range-select").value;
      if (range === "random") {
        questionList = getRandomQuestions(questionList, 10);
      } else if (range === "all") {
        // すべての問題を出題
      } else {
        const [start, end] = range.split("-").map(Number);
        questionList = questionList.slice(start-1,end);
      }
    
      questions = questionList.map(q => ({ ...q, category }));
      maxQuestions = questions.length;
      document.getElementById("total-questions").textContent = maxQuestions;
    }
    function selectedQuestionsAndStart(){
      updateQuestions();
      init();
      createQuiz();
    }

    function createQuiz() {
      const index = currentQuestionIndex;
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = "";
      if (currentQuestionIndex >= questions.length) {
          endQuiz();
          return;
      }
      isCorrect = 0;

      const question = questions[index];
      correctAnswers[index] = {
          category:question.category,
          index: question.index,
          問題文: question.問題文,
          数式:   question.数式,
          正解:   question.正解,
          解説:  (question.解説 || "").replace(/。/g, "<br>"),
          tags:   question.tags,
          難易度: question.難易度,
          類題ids:question.類題ids,

          type: question.type,
          correct:"×",
          回答: ""
      };

      // 問題エリア作成
      const questionDiv = document.createElement("div");
      questionDiv.classList.add("qArea");
      questionDiv.setAttribute("id", `question`);

      // 問題番号
      const questionIndex = document.createElement("p");
      questionIndex.textContent = `問題 ${index + 1}`;
      questionIndex.classList.add("qIndex");

      // 問題文
      const questionText = document.createElement("p");
      questionText.textContent = question.問題文;
      questionText.classList.add("qText");

      // 数式 (MathJax 用)
      const questionForm = document.createElement("p");
      questionForm.innerHTML = question.数式
      questionForm.classList.add("qFormula");

      const nextButton = document.createElement("button");
      nextButton.textContent = "次の問題へ";
      nextButton.classList.add("next-button");
      nextButton.onclick = nextQuestion;

      questionDiv.appendChild(questionIndex);
      questionDiv.appendChild(questionText);
      questionDiv.appendChild(questionForm);
      questionDiv.appendChild(nextButton);

      // コンテナに追加
      quizContainer.appendChild(questionDiv);
      MathJax.typesetPromise();
    }

  function normalizeMathML(mathml) {
      return mathml
        .replace(/\s+/g, '') // 余分な空白を削除
        .replace(/<mtext[^>]*>.*?<\/mtext>/g, '') // <mtext> の削除（MathJax の \( \) など）
        .replace(/<mstyle[^>]*>/g, '').replace(/<\/mstyle>/g, '') // <mstyle> の削除
        .replace(/<mrow[^>]*>/g, '').replace(/<\/mrow>/g, '') // <mrow> の削除（data-mjx-texclass含む）
        .replace(/mathcolor="[^"]*"/g, '') // MathJax が追加する余計な属性を削除
        .replace(/display="block"/g, '') // MathJax の display 属性を削除
        .replace(/math xmlns="[^"]*"/g, 'math') // xmlns 属性を統一
        .replace(/<\/?math>/g, ''); // <math> タグの削除（比較のため）
  }


  function showCorrectMark() {
      const questionDiv = document.getElementById(`question`);
  
      // 既に「〇」がある場合は削除
      let existingMark = questionDiv.querySelector(".correct-mark");
      if (existingMark) {
          existingMark.remove();
      }
      existingMark = questionDiv.querySelector(".incorrect-mark");
      if (existingMark) {
          existingMark.remove();
      }
  }

  function checkAnswer() {
    const correctTex = correctAnswers[currentQuestionIndex]["正解"];
    const mathField = document.getElementById("mathfield");
    const userTex = "\\("+mathField.getValue()+"\\)";
    // MathJax に数式を MathML としてレンダリング
    MathJax.typesetPromise().then(() => {
      // MathML の内部構造を取得
//      const correctMathML = document.getElementById("renderCorrect").querySelector("math").outerHTML;
//      const userMathML = document.getElementById("renderUser").querySelector("math").outerHTML;
      const correctMathML = MathJax.tex2mml(correctTex);
      const userMathML = MathJax.tex2mml(userTex);
//      console.log("正しい答え"+correctMathML)
//      console.log("入力した答え"+userMathML)
      // 正規化して比較

      const questionDiv = document.getElementById(`question`);
      // 以前の正誤マーク・正解エリアを削除
      showCorrectMark();

      let existingAnswer = questionDiv.querySelector(".answer-container");
      if (existingAnswer) {
          existingAnswer.remove();
      }

      // 正解判定
//      console.log("正しい答え"+normalizeMathML(correctMathML))
//      console.log("入力した答え"+normalizeMathML(userMathML))

      
      const mark = document.createElement("div");
      correctAnswers[currentQuestionIndex]["回答"]=userTex
      if(normalizeMathML(correctMathML) === normalizeMathML(userMathML)){
        questionDiv.style.backgroundColor = "#d4edda";
        mark.classList.add("correct-mark");
        isCorrect = 1;
        correctAnswers[currentQuestionIndex]["correct"]="○"
      }else{
        questionDiv.style.backgroundColor = "#f8d7da";
        mark.classList.add("incorrect-mark");
        isCorrect = 0;
        correctAnswers[currentQuestionIndex]["correct"]="×"
      }
      questionDiv.insertBefore(mark, questionDiv.firstChild);

      // 正解エリアを作成
      const answerContainer = document.createElement("div");
      answerContainer.classList.add("answer-container");

      // ユーザーの回答
      const inputText = document.createElement("p");
      inputText.classList.add("user-answer");
      inputText.innerHTML = `<strong>あなたの回答:</strong> ${userTex}`;
      answerContainer.appendChild(inputText);

      // 正解の表示
      const answerText = document.createElement("p");
      answerText.classList.add("correct-answer");
      answerText.innerHTML = `<strong>正解:</strong> ${correctTex}`;
      answerContainer.appendChild(answerText);

      // 解説
      const explanationText = document.createElement("p");
      explanationText.classList.add("explanation");
      explanationText.innerHTML = `<strong>解説:</strong><br> ${correctAnswers[currentQuestionIndex]["解説"]}`;
      answerContainer.appendChild(explanationText);

      questionDiv.appendChild(answerContainer);
      MathJax.typesetPromise();
    });
  }

  function nextQuestion() {
      if(isCorrect===1){
        totalScore++;
        document.getElementById("total-score").textContent = totalScore;
      }else{
        incorrectAnswers.push(correctAnswers[currentQuestionIndex]);
      }

      document.getElementById("mathfield").setValue("");
      console.log(maxQuestions)
      if (currentQuestionIndex < maxQuestions - 1) {
          currentQuestionIndex++;
          createQuiz();
      } else {
          endQuiz();
      }
  }

  function updateElapsedTime() {
    if (answeredQuestions.size < questions.length) {
      const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById("elapsed-time").textContent = elapsedTime;
      setTimeout(updateElapsedTime, 1000);
      return elapsedTime
    }
  }

function endQuiz() {
    let elapsedTime = updateElapsedTime();
    if(questions.length === 0){
      return;
    }
    // クイズの内容を削除
    document.getElementById("container").style.display = "none";
//    document.querySelector(".controls").style.display = "none"; // カテゴリ選択部分も非表示

    // 結果メッセージの表示
    document.getElementById("result-container").style.display = "block";

    let finalMessage = document.getElementById("final-message");
//    console.log(totalScore);
//    console.log(questions.length);
    if (totalScore === questions.length) {
//        console.log("aaa")
        finalMessage.textContent = `🎉 完璧です！全問正解おめでとうございます！ 🎉`;
    } else {
        finalMessage.textContent = `全問解答完了！お疲れ様でした🎉`;
    }

    // スコアの表示
    let scoreMessage = document.getElementById("final-score");
    scoreMessage.textContent = `スコア: ${totalScore} / ${questions.length}`;

    // 時間の表示
    let timeMessage = document.getElementById("final-elapsed-time");
    timeMessage.textContent = `タイム: ${elapsedTime}秒`;

    // 間違えた問題の表示
    let incorrectContainer = document.getElementById("incorrect-answers");
    if (!incorrectContainer) {
        incorrectContainer = document.createElement("div");
        incorrectContainer.id = "incorrect-answers";
        document.body.appendChild(incorrectContainer);
    }
    incorrectContainer.innerHTML = ""; // 以前の内容をクリア
    const retryButton = document.getElementById("retry-button");
    const retryCopyButton = document.getElementById("retryCopy-button");
    if (incorrectAnswers.length > 0) {
        let html = `<h2>間違った問題</h2>`;
        incorrectAnswers.forEach(q => {
//      <button class="relation-button" onclick="tryRelations('${q.類題ids}')">
          let buttonHtml = "";
          if (q.類題ids.length > 0) {
            let relation_link = window.location.href.split("?")[0] + "?index=" + q.類題ids.join(",");
            buttonHtml = `
                <button class="relation-button" onclick="window.open('${relation_link}','_blank')">
                    類題を解いてみる
                </button>
            `;
          }
            console.log(q.category);
            html += `
                <table class="result-table">
                    <tr><th>index</th><td>
                      ${q.category}_${q.index}
                      ${buttonHtml}
                    <tr><th>問題</th><td><p></p><p> ${q.問題文}</p><p>${q.数式}</p></td></tr>
                    <tr><th>正解</th><td>${q.正解}</td></tr>
                    <tr><th>回答</th><td>${q.回答}</td></tr>
                    <tr><th>解説</th><td>${q.解説 || "なし"}</td></tr>
                    <tr><th>難易度</th><td>${q.難易度}</td></tr>
                </table><br>`;
        });
        incorrectContainer.innerHTML = html;
        retryButton.disabled     = false;
        retryCopyButton.disabled = false;
    } else {
//        incorrectContainer.innerHTML = `<p>全問正解でした！🎉</p>`;
        retryButton.disabled     = true;
        retryCopyButton.disabled = true;
    }

    // 再挑戦ボタンの追加
//    document.getElementById("quiz-container").style.display = "button";

    // 結果表示部分へスクロール
    finalMessage.scrollIntoView({ behavior: "smooth", block: "start" });
    MathJax.typesetPromise();
}

  function scrollToNextQuestion(currentIndex) {
    const nextQuestion = document.getElementById(`question-${currentIndex + 1}`);
    if (nextQuestion) {
      nextQuestion.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }
	function init(){
    document.getElementById("container").style.display = "grid";
    document.getElementById("result-container").style.display = "none";
    resultAnswers = [];
    incorrectAnswers = []; // クリア
		answeredQuestions.clear();
    currentQuestionIndex=0;
		totalScore=0;
		startTime=Date.now();
    updateElapsedTime();
    document.getElementById("total-score").textContent = totalScore;
    document.getElementById("total-questions").textContent = questions.length;
	}

  function retryIncorrect() {
    questions = incorrectAnswers;
    init();
//    console.log(questions)
    createQuiz();
  }

  function retryUrlCopy(){
    const Ids = incorrectAnswers.map(q => `${q.category}_${q.index}`);
    url = window.location.href.split("?")[0] + "?index=" + Ids.join(",");
    console.log(url)
    if (window.confirm(`再挑戦用URLをクリップボードにコピーしますか？\n${url}\n`)) {
        // OKを押したらクリップボードにコピー
        navigator.clipboard.writeText(url)
            .then(() => alert("URLをコピーしました！"))
            .catch(err => alert("コピーに失敗しました: " + err));
    } else {
        console.log("コピーがキャンセルされました");
    }
  }

  function updateViewport() {
      let viewport = document.querySelector("meta[name=viewport]");
      if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
      }
  
      if (window.deviceWidth > 640) {
          // 高解像度デバイス（Retina など）向け
          viewport.content = "width=device-width, initial-scale=1";
      } else {
          // 通常の解像度向け
          viewport.content = "width=device-width, initial-scale=0.5";
      }
  }

  function getQueryParams() {
    const params = new URLSearchParams(window.location.search);
    const indexParam = params.get("index");
    const tagParam = params.get("tags");

    let indexes = [];
    if (indexParam) {
      indexes = indexParam.split(",");
      // 例: "1,2,5" → [1, 2, 5]
    }
    let tagList = [];
    if (tagParam) {
      // カンマ区切りで分割し、["計算", "工夫"]などの配列にする
      tagList = tagParam.split(",");
    }
    return { indexes, tagList };
  }


function findQuestionByUid(uidString) {
    const { category, localId } = parseUid(uidString);
    
    const questionList = allQuestions[category];
    if (!questionList) return null;

    const question = questionList.find(q => q.index === localId);
    return question ? { ...question, category } : null;
}

  function parseUid(uid) {
    const [category, localIdStr] = uid.split("_");
    return {
      category,
      localId: parseInt(localIdStr, 10)
    };
  }

  function createQuestionsFromIndexes(uidStrings) {
    let relatedQuestions = [];
    uidStrings.forEach(uid => {
      const relatedQuestion = findQuestionByUid(uid);
      if (relatedQuestion) {
        relatedQuestions.push(relatedQuestion);
      }
    });
  
    return relatedQuestions;
  }

  function tryRelations(uidStrings) {
    const uidList = uidStrings.split(",");
    questions = createQuestionsFromIndexes(uidList);
    init();
    createQuiz();
  }
